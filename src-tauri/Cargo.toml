[package]
name = "app"
version = "0.1.1"
description = "A Tauri App"
authors = ["you"]
license = ""
repository = ""
edition = "2024"
rust-version = "1.90"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "app_lib"
# רק לתוכנת המחשב. (staticlib/cdylib נועדו לאפליקציית טלפון שנבנית בכלי הזה —
# אצלנו אפליקציית האנדרואיד נבנית בנפרד, ולכן הם רק תפסו מקום וזמן בכל בנייה.)
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.0", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.0", features = [] }
tauri-plugin-log = "2"
